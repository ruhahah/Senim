<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Senim — тренажёр «Найди ложь ИИ»</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%2314532d'/><path d='M30 52l13 13 27-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/styles.css?v=9">
  <style>
    .g-wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
    .hero h1 { font-size: 30px; margin: 0 0 6px; }
    .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--yellow-bg); color: var(--yellow); }
    .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; }
    .opts select, .opts input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; }
    .question { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .bubble { background: var(--gray-bg); border-radius: 16px; padding: 16px 18px; line-height: 1.9; font-size: 17px; }
    .s { cursor: pointer; border-radius: 6px; padding: 2px 3px; transition: background .15s; border-bottom: 2px solid transparent; }
    .s:hover { background: rgba(127,127,127,.15); }
    .s.mark { background: var(--red-bg); border-bottom-color: var(--red); }
    .s.r-hit { background: var(--green-bg); border-bottom-color: var(--green); }
    .s.r-miss { background: var(--red-bg); border-bottom-color: var(--red); }
    .s.r-fa { background: var(--gray-bg); text-decoration: line-through; text-decoration-color: var(--muted); }
    .hud { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 8px; }
    .score { font-size: 44px; font-weight: 800; line-height: 1; }
    .fix { border-left: 4px solid var(--red); padding: 8px 12px; margin: 10px 0; background: var(--red-bg); border-radius: 0 10px 10px 0; }
    .fix.hit { border-left-color: var(--green); background: var(--green-bg); }
    .fix .q { font-size: 13px; color: var(--muted); margin-top: 4px; }
    table.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.lb td, table.lb th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    table.lb th { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .topic-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    @media (max-width: 600px) {
      .bubble { font-size: 18px; line-height: 2.1; padding: 14px; }
      .s { padding: 4px 3px; }
      .hud { position: sticky; bottom: 0; background: var(--card); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
      .hud .btn-primary { flex: 1 1 100%; min-height: 48px; font-size: 17px; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" style="text-decoration:none;color:inherit">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><path d="M30 52l13 13 27-30"/></svg></div>
    <div><div class="brand-name">Senim</div><div class="brand-tag" data-t="tag"></div></div>
  </a>
  <div class="top-right">
    <nav class="nav"><a href="/" data-t="navCheck"></a><a href="/trainer" class="on" data-t="navTrainer"></a><a href="/rating" data-t="navRating"></a><a href="/teacher" data-t="navTeacher"></a></nav>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button>
    </div>
  </div>
</header>

<main class="g-wrap">
  <section class="card hero">
    <span class="badge" data-t="badge"></span>
    <h1 data-t="title" style="margin-top:10px"></h1>
    <p class="muted" data-t="sub"></p>
    <p id="classLine" class="small hidden" style="font-weight:600"></p>
  </section>

  <section id="setup" class="card hidden">
    <div class="opts">
      <label><span class="field-label" data-t="lLang"></span>
        <select id="gLang"><option value="kk">Қазақша</option><option value="ru">Русский</option><option value="en">English</option></select></label>
      <label><span class="field-label" data-t="lErr"></span>
        <select id="gErr"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
      <label><span class="field-label" data-t="lTopic"></span><input id="gTopic" type="text" maxlength="80" autocomplete="off"></label>
    </div>
    <div id="chips" class="topic-chips"></div>
    <div class="actions"><button id="btnStart" class="btn btn-primary" data-t="start"></button></div>
    <div id="setupErr" class="notice error hidden"></div>
  </section>

  <section id="loading" class="card hidden"><div class="progress"><div class="spinner"></div><span data-t="loading"></span></div></section>

  <section id="game" class="card hidden">
    <label id="nameWrap" class="hidden"><span class="field-label" data-t="lName"></span><input id="gName" type="text" maxlength="40" autocomplete="off"></label>
    <p class="question" id="gQuestion"></p>
    <div class="bubble" id="gText"></div>
    <div class="hud">
      <span class="small muted" id="gCounter"></span>
      <span class="small muted" id="gTimer">0:00</span>
      <button id="btnCheck" class="btn btn-primary" data-t="check"></button>
    </div>
    <div id="gameErr" class="notice warn hidden"></div>
  </section>

  <section id="result" class="card hidden">
    <div class="row between" style="align-items:flex-end;flex-wrap:wrap;gap:12px">
      <div><div class="small muted" data-t="scoreLbl"></div><div class="score" id="rScore"></div></div>
      <div id="rLine" style="font-size:18px;font-weight:700"></div>
    </div>
    <div id="rFixes" style="margin-top:12px"></div>
    <p class="small muted" id="rSources"></p>
    <h3 data-t="lbTitle" style="margin-top:18px"></h3>
    <table class="lb"><thead><tr><th>#</th><th data-t="thName"></th><th data-t="thScore"></th><th data-t="thFound"></th><th data-t="thTime"></th></tr></thead><tbody id="lbBody"></tbody></table>
    <div class="actions"><button id="btnAgain" class="btn btn-primary" data-t="again"></button><button id="btnShare" class="btn" data-t="share"></button></div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const T = {
    ru: {
      tag: "Тренажёр", navCheck: "Проверка", navTrainer: "Тренажёр", navRating: "Рейтинг ИИ", navTeacher: "Учителю",
      badge: "Учебное упражнение: ошибки внесены намеренно", title: "Найди ложь ИИ",
      sub: "Senim спрятал в ответе ИИ несколько ошибок — дату, место или имя. Нажми на предложения, где, по-твоему, ИИ ошибся, и проверь себя.",
      lLang: "Язык", lErr: "Сколько ошибок спрятать", lTopic: "Тема (необязательно)", start: "Начать раунд", loading: "Составляю ответ ИИ с ошибками…",
      lName: "Твоё имя (для рейтинга)", check: "Проверить", q: "Вопрос ученика:", counter: (m, n) => `Отмечено: ${m} · спрятано ошибок: ${n}`,
      scoreLbl: "Очки", line: (c, n) => `Найдено ${c} из ${n}`, perfect: "Идеально! 🎯",
      hit: "Нашёл!", miss: "Пропустил", fa: "Это было верно", correct: "Верно:", quote: "Из справки:", sources: "Справки Senim:",
      lbTitle: "Рейтинг раунда", thName: "Имя", thScore: "Очки", thFound: "Найдено", thTime: "Время",
      again: "Ещё раунд", share: "Скопировать ссылку на раунд", copied: "Ссылка скопирована", needName: "Впиши имя — учитель увидит результат.",
      classLine: (n) => `Раунд класса «${n}»`, notFound: "Раунд не найден.", guest: "Гость", genErr: "Не получилось составить раунд. Попробуйте ещё раз через минуту.", tooMany: "Слишком много раундов. Попробуйте позже.",
    },
    kk: {
      tag: "Жаттықтырғыш", navCheck: "Тексеру", navTrainer: "Жаттықтырғыш", navRating: "ЖИ рейтингі", navTeacher: "Мұғалімге",
      badge: "Оқу жаттығуы: қателер әдейі енгізілген", title: "ЖИ-дің өтірігін тап",
      sub: "Senim ЖИ жауабына бірнеше қате жасырды — күн, орын немесе есім. ЖИ қай жерде қателесті деп ойласаң, сол сөйлемдерді бас та, өзіңді тексер.",
      lLang: "Тіл", lErr: "Қанша қате жасыру", lTopic: "Тақырып (міндетті емес)", start: "Раундты бастау", loading: "Қатесі бар ЖИ жауабын құрастырып жатырмын…",
      lName: "Атың (рейтинг үшін)", check: "Тексеру", q: "Оқушының сұрағы:", counter: (m, n) => `Белгіленді: ${m} · жасырылған қате: ${n}`,
      scoreLbl: "Ұпай", line: (c, n) => `${n} қатенің ${c}-ін таптың`, perfect: "Керемет! 🎯",
      hit: "Таптың!", miss: "Байқамадың", fa: "Бұл дұрыс еді", correct: "Дұрысы:", quote: "Анықтамадан:", sources: "Senim анықтамалары:",
      lbTitle: "Раунд рейтингі", thName: "Аты", thScore: "Ұпай", thFound: "Табылды", thTime: "Уақыт",
      again: "Тағы бір раунд", share: "Раунд сілтемесін көшіру", copied: "Сілтеме көшірілді", needName: "Атыңды жаз — мұғалім нәтижені көреді.",
      classLine: (n) => `«${n}» сыныбының раунды`, notFound: "Раунд табылмады.", guest: "Қонақ", genErr: "Раунд құрастырылмады. Бір минуттан кейін қайталап көріңіз.", tooMany: "Раунд тым көп. Кейінірек көріңіз.",
    },
    en: {
      tag: "Trainer", navCheck: "Check", navTrainer: "Trainer", navRating: "AI rating", navTeacher: "Teachers",
      badge: "Training exercise: mistakes planted on purpose", title: "Spot the AI's lie",
      sub: "Senim hid a few mistakes in an AI answer — a date, a place or a name. Tap the sentences where you think the AI is wrong, then check yourself.",
      lLang: "Language", lErr: "How many mistakes to hide", lTopic: "Topic (optional)", start: "Start round", loading: "Writing an AI answer with mistakes…",
      lName: "Your name (for the leaderboard)", check: "Check", q: "Student's question:", counter: (m, n) => `Marked: ${m} · hidden mistakes: ${n}`,
      scoreLbl: "Score", line: (c, n) => `Found ${c} of ${n}`, perfect: "Perfect! 🎯",
      hit: "Found it!", miss: "Missed", fa: "This one was true", correct: "Correct:", quote: "From the reference:", sources: "Senim references:",
      lbTitle: "Round leaderboard", thName: "Name", thScore: "Score", thFound: "Found", thTime: "Time",
      again: "Another round", share: "Copy round link", copied: "Link copied", needName: "Enter your name so the teacher sees your result.",
      classLine: (n) => `Class round “${n}”`, notFound: "Round not found.", guest: "Guest", genErr: "Couldn't build the round. Try again in a minute.", tooMany: "Too many rounds. Try later.",
    },
  };
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle("hidden", !on);
  let lang = (() => { try { return localStorage.getItem("senim.lang") || "ru"; } catch { return "ru"; } })();
  const tt = (k) => (T[lang] || T.ru)[k];
  const params = new URLSearchParams(location.search);
  let round = null, marked = new Set(), t0 = 0, timer = null, result = null;

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else e.setAttribute(k, v); }
    for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(k == null ? "" : String(k)));
    return e;
  }
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  function applyT() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((e) => { const v = tt(e.dataset.t); if (typeof v === "string") e.textContent = v; });
    document.querySelectorAll(".lang-switch button").forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));
    if (round) renderGame();
    if (result) renderResult();
    if (round && round.class_name) { $("classLine").textContent = tt("classLine")(round.class_name); show("classLine", true); }
  }

  async function loadTopics() {
    try {
      const d = await (await fetch(`/api/trainer/topics?lang=${$("gLang").value}`)).json();
      const pick = d.topics.sort(() => Math.random() - 0.5).slice(0, 8);
      $("chips").replaceChildren(...pick.map((t) => { const b = el("button", { class: "chip" }, t); b.onclick = () => { $("gTopic").value = t; }; return b; }));
    } catch {}
  }

  async function start() {
    show("setupErr", false); show("setup", false); show("result", false); show("loading", true);
    try {
      const res = await fetch("/api/trainer/new", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lang: $("gLang").value, topic: $("gTopic").value.trim(), n_errors: Number($("gErr").value) }) });
      const d = await res.json().catch(() => ({}));
      // текст ошибки сервера не переведён — показываем понятное сообщение на языке интерфейса
      if (!res.ok) throw new Error(res.status === 429 ? ((d.detail && d.detail.message) || tt("tooMany")) : tt("genErr"));
      await openRound(d.id, true);
    } catch (e) {
      show("loading", false); show("setup", true);
      $("setupErr").textContent = String(e.message || e); show("setupErr", true);
    }
  }

  async function openRound(id, pushUrl) {
    const res = await fetch(`/api/trainer/${encodeURIComponent(id)}`);
    if (!res.ok) throw new Error(tt("notFound"));
    round = await res.json();
    if (pushUrl) history.replaceState(null, "", `/trainer?r=${round.id}`);
    marked = new Set(); result = null;
    show("loading", false); show("result", false); show("game", true);
    show("nameWrap", true);
    $("gName").value = (() => { try { return localStorage.getItem("senim.student") || ""; } catch { return ""; } })();
    if (round.class_name) { $("classLine").textContent = tt("classLine")(round.class_name); show("classLine", true); }
    renderGame();
    t0 = Date.now(); clearInterval(timer);
    timer = setInterval(() => { $("gTimer").textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }, 500);
  }

  function renderGame() {
    if (!round) return;
    $("gQuestion").textContent = round.question ? `${tt("q")} ${round.question}` : "";
    $("gText").replaceChildren(...round.sentences.flatMap((s, i) => {
      const sp = el("span", { class: "s" + (marked.has(i) ? " mark" : ""), role: "button", tabindex: "0" }, s);
      const toggle = () => { if (result) return; marked.has(i) ? marked.delete(i) : marked.add(i); renderGame(); };
      sp.onclick = toggle; sp.onkeydown = (e) => { if (e.key === "Enter") toggle(); };
      return [sp, " "];
    }));
    $("gCounter").textContent = tt("counter")(marked.size, round.n_errors);
  }

  async function check() {
    const name = $("gName").value.trim();
    if (round.class_name && !name) { $("gameErr").textContent = tt("needName"); show("gameErr", true); $("gName").focus(); return; }
    show("gameErr", false);
    try { localStorage.setItem("senim.student", name); } catch {}
    clearInterval(timer);
    const seconds = Math.floor((Date.now() - t0) / 1000);
    const res = await fetch(`/api/trainer/${round.id}/answer`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ student: name || tt("guest"), marked: [...marked], seconds }) });
    result = await res.json();
    show("game", false); show("result", true);
    renderResult();
  }

  function renderResult() {
    const r = result;
    $("rScore").textContent = r.score;
    $("rLine").textContent = tt("line")(r.correct, r.total) + (r.missed === 0 && r.false_alarms === 0 ? " · " + tt("perfect") : "");
    const items = [];
    const bubble = el("div", { class: "bubble" }, ...r.reveal.flatMap((s) => {
      const cls = s.false ? (s.marked ? "r-hit" : "r-miss") : (s.marked ? "r-fa" : "");
      return [el("span", { class: "s " + cls }, s.text), " "];
    }));
    items.push(bubble);
    r.reveal.forEach((s) => {
      if (s.false) {
        items.push(el("div", { class: "fix" + (s.marked ? " hit" : "") },
          el("b", {}, (s.marked ? "✓ " + tt("hit") : "✗ " + tt("miss")) + " — "), s.text,
          el("div", {}, el("b", {}, tt("correct") + " "), s.correct),
          s.quote ? el("div", { class: "q" }, `${tt("quote")} «${s.quote}»`) : ""));
      } else if (s.marked) {
        items.push(el("div", { class: "fix", style: "border-left-color:var(--gray);background:var(--gray-bg)" }, el("b", {}, tt("fa") + " — "), s.text));
      }
    });
    $("rFixes").replaceChildren(...items);
    $("rSources").textContent = r.sources && r.sources.length ? `${tt("sources")} ${r.sources.map((x) => x.title).join(", ")}` : "";
    $("lbBody").replaceChildren(...(r.leaderboard || []).map((x, i) => el("tr", {},
      el("td", {}, i + 1), el("td", {}, x.student), el("td", {}, x.score), el("td", {}, `${x.correct}/${x.correct + x.missed}`), el("td", {}, fmt(x.seconds)))));
  }

  $("btnStart").onclick = start;
  $("btnCheck").onclick = check;
  $("btnAgain").onclick = () => {
    if (round && round.class_name) { location.href = "/trainer"; return; }
    round = null; result = null; show("result", false); show("setup", true); history.replaceState(null, "", "/trainer"); loadTopics();
  };
  $("btnShare").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $("btnShare").textContent = tt("copied"); setTimeout(() => ($("btnShare").textContent = tt("share")), 1500); } catch {}
  };
  $("gLang").onchange = loadTopics;
  document.querySelectorAll(".lang-switch button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang; try { localStorage.setItem("senim.lang", lang); } catch {} applyT();
  }));

  $("gLang").value = ["kk", "ru", "en"].includes(lang) ? lang : "ru";
  applyT();
  if (params.get("r")) {
    show("loading", true);
    openRound(params.get("r")).catch((e) => { show("loading", false); show("setup", true); $("setupErr").textContent = e.message; show("setupErr", true); loadTopics(); });
  } else {
    show("setup", true); loadTopics();
  }
})();
</script>
</body>
</html>
